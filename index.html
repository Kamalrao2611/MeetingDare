
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noimageindex, noindex, noarchive, nosnippet, nofollow">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta name="twitter:card" content="none">

    <title>Meeting Dare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 50px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        h1 {
            color: #d63384;
        }

        p {
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            background-color: #d63384;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #yesButton {
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 15px;
            transition: left 0.2s ease, top 0.2s ease;
        }

        #noButton {
            font-size: 16px;
            padding: 10px 20px;
            position: relative;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 25px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <h1>You want to meet me</h1>

    <p>
        Dear Guddu... You really want to meet me...
        and Hug me...did you try with real conviction?
    </p>

    <div class="button-container">

        <button id="yesButton" onclick="alert('')">
            Of course!
        </button>

        <button id="noButton" onclick="alert('Hope you will try whole heartedly next time 🤞')">
            No
        </button>

    </div>

    <script>

        // YES BUTTON MOVEMENT

        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        // Desktop: move on hover
        yesButton.addEventListener('mouseenter', moveYesButton);

        // Mobile: move on touch
        yesButton.addEventListener('touchstart', function(event) {
            event.preventDefault();
            moveYesButton();
        }, { passive: false });

        function moveYesButton() {

            yesButton.style.position = 'fixed';

            const padding = 20;
            const minDistance = 20;

            const maxX = window.innerWidth - yesButton.offsetWidth - padding;
            const maxY = window.innerHeight - yesButton.offsetHeight - padding;

            const noRect = noButton.getBoundingClientRect();

            const noCenterX = (noRect.left + noRect.right) / 2;
            const noCenterY = (noRect.top + noRect.bottom) / 2;

            let randomX, randomY;
            let isTooClose = true;
            let attempts = 0;

            while (isTooClose && attempts < 200) {

                attempts++;

                randomX = padding + Math.random() * Math.max(0, maxX - padding);
                randomY = padding + Math.random() * Math.max(0, maxY - padding);

                const yesCenterX = randomX + yesButton.offsetWidth / 2;
                const yesCenterY = randomY + yesButton.offsetHeight / 2;

                const distance = Math.hypot(
                    yesCenterX - noCenterX,
                    yesCenterY - noCenterY
                );

                isTooClose = distance < minDistance;
            }

            if (!isTooClose) {
                yesButton.style.left = randomX + 'px';
                yesButton.style.top = randomY + 'px';
            }
        }


        // NO BUTTON MESSAGE

        function showNoMessage() {
            alert("Please try whole heartedly next time ❤️");
        }

    </script>

</body>
</html>
